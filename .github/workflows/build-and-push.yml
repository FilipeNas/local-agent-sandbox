name: build-and-push

# Keeps ghcr.io/filipenas/local-agent-sandbox:latest current.
# Triggers: every push to main, a nightly cron, or manual dispatch.
# Delegates the actual build to the reusable _build.yml (single source of truth),
# which overwrites the :latest tag each run.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  latest:
    uses: ./.github/workflows/_build.yml
    with:
      tags: latest
    secrets: inherit
