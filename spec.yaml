schemaVersion: "1"
kind: sandbox
name: filipe-local-agent-sandbox
displayName: Filipe local agent sandbox
description: Filipe local agent sandbox

sandbox:
  image: "ghcr.io/filipenas/local-agent-sandbox:latest"
  aiFilename: CLAUDE.md
  # No --dangerously-skip-permissions flag needed: ~/.claude/settings.json (user
  # scope) sets defaultMode "bypassPermissions" + skipDangerousModePermissionPrompt.
  entrypoint:
    run: ["claude"]

caps:
  network:
    allow:
      - "**"

environment:
  variables:
    IS_SANDBOX: "1"

agentContext: |
  ## Environment

  You are running inside a Docker Sandbox microVM (Ubuntu 26.04), not on the
  host, with Docker installed — you can build and run containers here directly.
  The workspace is a bind mount of a real host directory: edits and deletions
  here affect actual files on the developer's machine. Everything outside the
  workspace is VM-local and disappears when the sandbox is removed.

  The network policy is open — all outbound HTTP/HTTPS is permitted and nothing
  is filtered. Note that UDP and ICMP are blocked at the network layer, so
  `ping` and DNS-over-UDP diagnostics will not work; use `curl` to test connectivity.

  `sudo` is available without a password. Prefer `brew` for user-space tools and
  `apt-get` only for system packages.

  ## Tooling

  - Kubernetes: kubectl (aliased through kubecolor interactively), kubectx,
    krew, kustomize, helm, stern
  - IaC: opentofu (`tofu`), terragrunt, terraform-docs, tflint
  - AWS: awscli, awscurl, awsdac, docker-credential-helper-ecr
  - Data: pgcli, mysql client
  - Shell: ripgrep, jq, yq, fzf, zoxide, nmap, ipcalc, websocat
  - Python: ruff, isort, pre-commit (managed by uv, not pip — use
    `uv tool install <pkg>` to add more)

  All tools are baked into the image, not installed at boot. Homebrew lives at
  /home/linuxbrew/.linuxbrew; brew's bin, ~/.krew/bin, ~/.local/bin, and keg-only
  mysql-client are all on PATH, so tool calls resolve directly.
